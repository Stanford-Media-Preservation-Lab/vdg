[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vdg"
version = "1.7.1"
description = "Video Derivative Generator for SMPL digitization and acquisitions workflows"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Stanford Media Preservation Lab" }
]
requires-python = ">=3.10"
dependencies = [
    "tqdm>=4.65",
]

[project.scripts]
vdg = "vdg.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vdg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
